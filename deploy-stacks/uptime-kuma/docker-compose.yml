# For Hosttiva's own public status page, use infra/status-page (separate server). This stack is for customers.
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    volumes: [kuma-data:/app/data]
    networks: [web]
    labels:
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3001}}"
networks:
  web: { external: true }
volumes:
  kuma-data:

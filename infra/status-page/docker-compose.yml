# Hosttiva status page: Uptime Kuma behind Caddy (automatic HTTPS) for status.hosttiva.com
# Run on a small VPS that is NOT the same machine as the services it monitors.
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - kuma-data:/app/data
    environment:
      - TZ=${TZ:-UTC}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - STATUS_DOMAIN=${STATUS_DOMAIN:-status.hosttiva.com}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - uptime-kuma

volumes:
  kuma-data:
  caddy-data:
  caddy-config:

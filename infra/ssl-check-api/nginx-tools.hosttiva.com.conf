# /etc/nginx/sites-available/tools.hosttiva.com
server {
    listen 80;
    server_name tools.hosttiva.com;

    location = /ssl {
        proxy_pass http://127.0.0.1:8787/ssl;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 15s;
    }
    location = /health { proxy_pass http://127.0.0.1:8787/health; }
    location / { return 404; }
}
